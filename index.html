<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --fg: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Sarabun", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: clamp(3rem, 14vw, 10rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    text-transform: uppercase;
  }
  h1 span { color: var(--accent); }
  p {
    margin-top: 1.5rem;
    font-size: clamp(1rem, 3vw, 1.5rem);
    font-weight: 300;
    color: var(--muted);
  }
  .bar {
    width: 80px;
    height: 4px;
    margin: 2rem auto 0;
    background: var(--accent);
    border-radius: 2px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .3; width: 40px; }
    50% { opacity: 1; width: 120px; }
  }
</style>
</head>
<body>
  <main>
    <h1>Coming <span>Soon</span></h1>
    <div class="bar"></div>
  </main>
</body>
</html>
